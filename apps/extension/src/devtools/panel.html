<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScriptPilot Panel</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background-color: #ffffff;
        height: 100vh;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: between;
      }

      .title {
        font-weight: 600;
        color: #343a40;
      }

      .content {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 200px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="header">
        <div class="title">ScriptPilot - Script Debugging</div>
      </div>
      <div class="content">
        <div class="loading">Loading scripts for current page...</div>
      </div>
    </div>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
