<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScriptPilot</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background-color: #ffffff;
        color: #1f2937;
      }

      /* Popup mode styles */
      body.popup-mode {
        width: 420px;
        min-height: 580px;
        max-height: 600px;
        overflow: hidden;
      }

      /* Fullscreen mode styles */
      body.fullscreen-mode {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* Loading styles */
      .loading {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 580px;
        color: #6b7280;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .loading h2 {
        color: white;
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 20px;
      }

      .loading p {
        color: rgba(255, 255, 255, 0.8);
        margin: 8px 0;
        font-size: 14px;
      }

      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid #ffffff;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Enhanced ScriptPilot branding */
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .brand-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(45deg, #667eea, #764ba2);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 18px;
      }

      /* Error styles */
      .error {
        padding: 20px;
        text-align: center;
        color: #dc2626;
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 8px;
        margin: 20px;
      }

      .error h3 {
        margin: 0 0 8px 0;
        color: #dc2626;
      }

      .error button {
        margin-top: 12px;
        padding: 8px 16px;
        background: #dc2626;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }

      .error button:hover {
        background: #b91c1c;
      }
    </style>
    <script type="module" src="popup-init.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="brand">
          <div class="brand-icon">SP</div>
          <h2>ScriptPilot</h2>
        </div>
        <div class="spinner"></div>
        <p>Modern Userscript Manager</p>
        <p>Loading your scripts...</p>
      </div>
    </div>

    <script type="module" src="./popup.tsx"></script>
  </body>
</html>
